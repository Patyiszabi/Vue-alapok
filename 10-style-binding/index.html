<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Init Vue App</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="appdiv">
        <h1>Guitars</h1>
        <div class="guitars">
            <div v-for="guitar in guitars" :key="guitar.id">
                <h2>{{guitar.name}}</h2>
                <span v-if="guitar.stock === 0" :style="{ color: outofstockcolor }">Out of Stock</span>
                <span v-else-if="guitar.stock < 3" :style="{ color: onylyfewleftcolor }">Last chance, only {{guitar.stock}} left</span>
                <span v-else :style="{ color: instockcolor }">In Stock</span>
            </div>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
