<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Init Vue App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="appdiv">
        <!-- <form id="userform" action="" @submit.prevent="submit()">  js megoldas -->
        <form ref="userform" action="" @submit.prevent="submit()">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" v-model="data.name">
                <!-- <p>{{ data.name }}</p> -->
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" v-model="data.email">
                <!-- <p>{{ data.email }}</p> -->
            </div>

            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>

    <script src="main.js"></script>
</body>
</html>
